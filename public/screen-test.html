<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Screen Share Test</title>
<!-- Temporary check: can this phone's browser share its screen from a web
     page (getDisplayMedia)? Decides whether doctors can mirror to the
     bedside screen without installing an app. Nothing leaves the phone. -->
<style>
  :root { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --ok: #22C55E; --bad: #EF4444; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; font-size: 15px; line-height: 1.6; }
  .ok { color: var(--ok); font-weight: 700; }
  .bad { color: var(--bad); font-weight: 700; }
  button { width: 100%; height: 56px; border: 0; border-radius: 999px; background: #008AAB; color: #fff;
    font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  button:disabled { opacity: .5; }
  video { width: 100%; border-radius: 12px; background: #000; display: none; margin-bottom: 14px; }
  #ua { font-size: 12px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<h1>Screen share test</h1>
<p>Checks whether this phone can share its screen from a web page. Nothing is sent anywhere — the preview stays on this phone.</p>
<div class="card" id="support"></div>
<button id="go">Share my screen</button>
<video id="preview" autoplay muted playsinline></video>
<div class="card" id="result">Tap the button, allow sharing, then switch to another app for a few seconds and come back.</div>
<div class="card" id="ua"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const has = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  $("ua").textContent = navigator.userAgent;
  $("support").innerHTML = has
    ? '<span class="ok">✓ This browser has screen sharing.</span> Tap the button to try it.'
    : '<span class="bad">✗ This browser has no screen sharing.</span> A web page can\'t share this phone\'s screen.';
  $("go").disabled = !has;
  let frames = 0, started = 0;
  $("go").addEventListener("click", async () => {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
      const track = stream.getVideoTracks()[0];
      const s = track.getSettings();
      $("preview").srcObject = stream;
      $("preview").style.display = "block";
      started = Date.now();
      const count = () => { frames++; $("preview").requestVideoFrameCallback(count); };
      if ($("preview").requestVideoFrameCallback) $("preview").requestVideoFrameCallback(count);
      const show = () => {
        const secs = Math.max(1, (Date.now() - started) / 1000);
        $("result").innerHTML = '<span class="ok">✓ Sharing works.</span><br>'
          + "Shared: " + (s.displaySurface || "screen") + " · " + (s.width || "?") + "×" + (s.height || "?")
          + "<br>Frames seen: " + frames + " (" + (frames / secs).toFixed(1) + "/s)"
          + "<br>Status: " + track.readyState
          + "<br><br>Now switch to another app and back — the preview should keep updating.";
      };
      show();
      const timer = setInterval(show, 1000);
      track.addEventListener("ended", () => { clearInterval(timer); show(); $("result").innerHTML += '<br><b>Sharing stopped.</b>'; });
    } catch (e) {
      $("result").innerHTML = '<span class="bad">✗ Sharing failed:</span> ' + (e && e.name) + " — " + (e && e.message);
    }
  });
</script>
</body>
</html>
