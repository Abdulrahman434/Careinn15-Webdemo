<style>
/* Layout: a technical spec — sticky contents rail on wide screens, one reading column, specimens and tables at full column width. */
:root {
  --bg: #F4F6F9;
  --paper: #FFFFFF;

  --warn-soft: #FBECEE;
  --ok: #1A7F4B;
  --ok-soft: #E8F5EE;

    --rule: #2A3540; --rule-soft: #212B35; --accent: #9DB4E8; --accent-soft: #1F2A3D;
    --code-bg: #1C2530; --warn: #FF8A93; --warn-soft: #3A1F24; --ok: #6FD49E; --ok-soft: #173126;
    --star: #F2B85B; --star-soft: #3A2C14; --new: #8DB4F5; --new-soft: #1C2A40; --chg: #B79AF2; --chg-soft: #2A2140; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --paper: #161D25; --ink: #E6ECF1; --ink-2: #B3BFCA; --ink-3: #8E9BA7;
  --rule: #2A3540; --rule-soft: #212B35; --accent: #9DB4E8; --accent-soft: #1F2A3D;
  --code-bg: #1C2530; --warn: #FF8A93; --warn-soft: #3A1F24; --ok: #6FD49E; --ok-soft: #173126;

* { box-sizing: border-box; }

.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; font-size: 14px; }

}

.lede { font-size: 17px; color: var(--ink-2); max-width: 70ch; margin: 0 0 18px; }

.sec-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }

.badge.top { background: var(--star-soft); color: var(--star); }
.badge.fix { background: var(--warn-soft); color: var(--warn); }
code { font-family: var(--f-mono); font-size: .88em; background: var(--code-bg); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
ul.tight, ol.tight { margin: 0 0 12px; padding-inline-start: 20px; max-width: 75ch; }
ul.tight li, ol.tight li { margin: 4px 0; }

.pf { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 14px 0 6px; }
.pf > * { min-width: 0; }
.pf > div { border-radius: 12px; padding: 12px 14px; font-size: 15px; }

.pf .want b { color: var(--ok); }

table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 560px; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
th { background: var(--bg); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
td.v { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-inline-end: 6px; border: 1px solid rgba(0,0,0,.12); }

.code { position: relative; margin: 10px 0 16px; }
.code pre { margin: 0; background: var(--code-bg); border-radius: 12px; padding: 14px 16px; overflow-x: auto; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; color: var(--ink); }
.code .lang { position: absolute; top: 8px; inset-inline-end: 64px; font-size: 11px; color: var(--ink-3); font-family: var(--f-mono); }
.code button { position: absolute; top: 6px; inset-inline-end: 8px; font: 600 12px var(--f-body); color: var(--ink-2); background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; padding: 3px 9px; cursor: pointer; }

.diagram img { display: block; width: 100%; height: auto; border: 0; border-radius: 0; }

.zone span { font: 700 clamp(9px, 1.15vw, 14px)/1.25 var(--f-mono); background: rgba(10,16,24,.82); color: #fff; padding: 3px 7px; border-radius: 5px; margin-top: 6px; text-align: center; white-space: nowrap; }
.z1 { border-color: #E2453A; background: rgba(226,69,58,.06); }
.z2 { border-color: #2C7BE5; background: rgba(44,123,229,.05); }

.ratio-wrap { overflow-x: auto; }

/* product specimens (fixed product colours on purpose) */
.specimens { display: flex; flex-wrap: wrap; gap: 18px; padding: 22px; background: #E9EDF1; border-radius: 14px; margin: 12px 0 16px; }

.spec { display: grid; gap: 8px; justify-items: center; }

.hub {
  width: 168px; height: 208px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background-color: #FFFFFF; border: 1px solid rgba(27,42,50,.10);

  font: 600 17px var(--f-display); color: #1B2A32;

.hub .ib { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid; }

.more-tile { display: grid; justify-items: center; gap: 10px; padding: 14px 18px; border-radius: 18px; background: #fff; }

.more-tile span { font: 600 18px var(--f-display); color: #56646F; }

.ar-demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 12px 0 16px; }
.ar-demo > * { min-width: 0; }
.ar-box { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #DDE3EA; color: #1B2A32; }
.ar-box b { display: block; font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
.ar-box.bad b { color: #B4232F; } .ar-box.good b { color: #1A7F4B; }
.ar-line { font-family: "Almarai", sans-serif; font-weight: 800; font-size: 30px; direction: rtl; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: repeating-linear-gradient(0deg, transparent 0 10px, rgba(44,123,229,.06) 10px 11px); }

.fixlist td:first-child { font-family: var(--f-mono); color: var(--ink-3); width: 36px; }
.fixlist tr.prio td { background: var(--star-soft); }
.fixlist a { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
.note { border-inline-start: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 12px 0 16px; font-size: 15px; max-width: 80ch; }
footer { color: var(--ink-3); font-size: 13.5px; text-align: center; padding-top: 6px; }
/* ── Revision blocks ── */
main > * { min-width: 0; }
main { grid-template-columns: minmax(0, 1fr); }
.tag { display: inline-flex; align-items: center; font: 700 11.5px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.tag.new { background: var(--new-soft); color: var(--new); }
.tag.open { background: var(--star-soft); color: var(--star); }
.tag.chg { background: var(--chg-soft); color: var(--chg); }
.tag.issue { background: var(--warn-soft); color: var(--warn); }
.rev-top { border: 2px solid var(--accent); }
.rev-date { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); margin-inline-start: auto; }
.done-well { background: var(--ok-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; max-width: none; }
.done-well b { color: var(--ok); margin-inline-end: 6px; }
.finger-note { border-inline-start: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 12px 12px 0; padding: 12px 16px 4px; margin: 0 0 14px; }
.finger-note .tbl { background: var(--paper); }
tr.finger td { background: var(--accent-soft); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--ink-2); margin: 4px 0 4px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.revlist td { padding-block: 6px; }
.revlist td:first-child { font-family: var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.revlist a { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; min-height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 800; text-decoration: none; }
.revlist tr.grp-row td { background: var(--bg); font: 700 11.5px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-block: 6px; }
.next-up { color: var(--ink-2); font-size: 15px; margin-top: 4px; max-width: none; }
.rev-item .sec-head .tag { margin-inline-start: 4px; }
.now-chip, .want-chip { display: inline-block; font: 700 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; margin-inline-end: 6px; }
.now-chip { background: var(--warn-soft); color: var(--warn); }
.want-chip { background: var(--ok-soft); color: var(--ok); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; align-items: start; margin: 12px 0 18px; }

.rev-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; border-top: 1px solid var(--rule); margin-top: 20px; padding-top: 14px; }
.rev-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; background: var(--bg); }
.rev-nav a:active { background: var(--accent-soft); }
.rev-nav a:last-child { background: var(--accent); color: var(--paper); border-color: var(--accent); }

.err-t { color: var(--warn); font-weight: 600; }
.miss { color: var(--warn); font-style: italic; }
.str-note, .refs { font-size: 14px; color: var(--ink-3); }

.rev-mark { display: inline-flex; font: 700 11px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-decoration: none; white-space: nowrap; }
.rev-mark.chg { background: var(--chg-soft); color: var(--chg); }
.toc .grp { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 14px 10px 4px; }
.toc .grp:first-of-type { margin-top: 0; }
.toc .rt { margin-inline-start: auto; width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.toc .rt.new { background: var(--new); } .toc .rt.open { background: var(--star); } .toc .rt.chg { background: var(--chg); } .toc .rt.issue { background: var(--warn); }
@media (min-width: 961px) { .toc { max-height: calc(100vh - 40px); overflow-y: auto; } }
@media (max-width: 960px) { .toc .grp { grid-column: 1 / -1; } }
/* scrollbar specimen (fixed product colours on purpose) */
.sb-demo { position: relative; display: inline-grid; grid-template-columns: 220px 12px; gap: 0; padding: 14px; background: #FFFFFF; border: 1px solid #DDE3EA; border-radius: 16px; margin: 8px 0 16px; }
.sb-body { display: grid; gap: 8px; height: 150px; overflow: hidden; }
