<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var byId = {};
  links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
  var setActive = function (id) {
    links.forEach(function (a) { a.classList.toggle('active', a === byId[id]); });
  };
  var sections = Array.prototype.slice.call(document.querySelectorAll('main section[id]'));
  var pick = function () {
    var line = window.innerHeight * 0.3, current = sections[0] && sections[0].id;
    sections.forEach(function (sec) { if (sec.getBoundingClientRect().top <= line) current = sec.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) current = sections[sections.length - 1].id;
    setActive(current);
  };
  window.addEventListener('scroll', pick, { passive: true });
  window.addEventListener('resize', pick);
  links.forEach(function (a) { a.addEventListener('click', function () { setActive(a.getAttribute('href').slice(1)); }); });
  pick();
})();
document.querySelectorAll('[data-copy]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var pre = btn.parentElement.querySelector('pre');
    var text = pre.innerText;
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); };
    var fallback = function () {
      var r = document.createRange(); r.selectNodeContents(pre);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = 'Selected';
      setTimeout(function () { btn.textContent = 'Copy'; }, 1400);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else { fallback(); }
    } catch (e) { fallback(); }
  });
});
</script>
