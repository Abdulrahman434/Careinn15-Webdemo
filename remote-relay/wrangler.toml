name = "careinn-remote"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Served at wss://careinn-remote.abalfaqih.workers.dev. To move it to
# remote.careinn.com, the careinn.com zone must be in this Cloudflare account;
# then add: routes = [{ pattern = "remote.careinn.com", custom_domain = true }]
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
